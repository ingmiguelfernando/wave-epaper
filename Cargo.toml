[package]
name = "waveshare-epd397-rust-app"
version = "0.10.5"
authors = ["Piyush Daiya"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "Wave: custom e-reader firmware for the Waveshare ESP32-S3 e-Paper 3.97 board, forked from rustmix-wave"
license = "MIT"

[[bin]]
name = "waveshare-epd397-rust-app"
harness = false

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
anyhow = "1"
embedded-graphics = "0.8.1"
embedded-hal = "1.0"
log = "0.4"
# Hyphenation patterns, limited to the languages the Reader hyphenates.
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "spanish"] }
# Photos; without rayon, which would start a thread pool.
jpeg-decoder = { version = "0.3.2", default-features = false }
miniz_oxide = "0.8"

[dev-dependencies]
# Builds test JPEGs in memory, so no image files are committed.
jpeg-encoder = "0.7.1"

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = "0.52.1"
es8311 = "0.1.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.1"
esp_idf_tools_install_dir = "global"
