name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml selects the Xtensa "esp" toolchain; host checks run on stable.
  RUSTUP_TOOLCHAIN: stable

jobs:
  host:
    name: Format and host tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run host tests
        run: ./scripts/test-host.sh
        env:
          # Also renders every preview screen to PNG (see src/app/preview.rs).
          WAVE_PREVIEW_DIR: ${{ github.workspace }}/preview

      - name: Upload screen previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-previews
          path: preview/
          if-no-files-found: ignore

      # Last, so a formatting slip still reports test results and previews.
      - name: Check formatting
        run: cargo fmt --all -- --check
